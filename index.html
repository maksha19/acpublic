<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: members skew older and pinch-zoom
         on a phone in daylight is exactly the behaviour we must not block. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#004165" />
    <!-- District name duplicated from src/content/conference.ts — static HTML
         cannot import it. Change both together. -->
    <meta
      name="description"
      content="Toastmasters District 80 Annual Conference 2027 — 15–16 May 2027, Singapore. Keynotes, contest finals and the gala dinner. Register for yourself or book a table of ten."
    />
    <title>Annual Conference 2027 — Toastmasters District 80</title>
    <meta property="og:title" content="Annual Conference 2027 — Toastmasters District 80" />
    <meta
      property="og:description"
      content="Two days of keynotes, contest finals and connection — 15–16 May 2027, Singapore."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Toastmasters brand typefaces: Montserrat for headings, Source Sans 3
         for body. Loaded from Google Fonts with a system fallback so the page
         is readable before the webfont arrives. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
